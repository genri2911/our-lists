<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Наши списки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto; }
  header { padding: 14px 16px 6px; }
  h1 { margin: 0; font-size: 22px; }
  .filters { display: flex; gap: 8px; padding: 6px 16px 10px; overflow-x: auto; }
  .chip { border: 0; background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 16px; font-size: 14px; white-space: nowrap; }
  .chip.active { background: var(--btn); color: var(--btn-text); }
  main { flex: 1; overflow-y: auto; padding: 0 16px 90px; }
  .empty { text-align: center; color: var(--hint); margin-top: 60px; }
  .item { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
  .item.done .title { text-decoration: line-through; color: var(--hint); }
  .check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--hint); background: transparent; color: var(--btn-text); font-size: 15px; line-height: 1; padding: 0; }
  .item.done .check { background: var(--btn); border-color: var(--btn); }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; word-wrap: break-word; }
  .sub { color: var(--hint); font-size: 14px; margin-top: 2px; word-wrap: break-word; }
  .sub a { color: var(--link); }
  .stars { color: #f5a623; letter-spacing: 1px; }
  .who { color: var(--hint); font-size: 12px; margin-top: 4px; }
  #fab { position: fixed; right: 20px; bottom: 76px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-text); font-size: 32px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  nav { display: flex; border-top: 1px solid rgba(128,128,128,.25); background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; color: var(--hint); padding: 10px 0 8px; font-size: 12px; }
  nav button .ic { display: block; font-size: 22px; }
  nav button.active { color: var(--btn); font-weight: 600; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 640px; border-radius: 18px 18px 0 0; padding: 16px; max-height: 90%; overflow-y: auto; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 10px 0 4px; }
  input[type=text], input[type=url], textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(128,128,128,.35); background: var(--card); color: var(--text); font: inherit; }
  .starpick { font-size: 30px; color: #f5a623; user-select: none; }
  .starpick span { padding: 0 3px; cursor: pointer; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .row button { flex: 1; padding: 12px; border-radius: 10px; border: 0; font-size: 16px; }
  .save { background: var(--btn); color: var(--btn-text); }
  .cancel { background: var(--card); color: var(--text); }
  .del { background: transparent; color: var(--danger); }
  .banner { margin: 0 16px 8px; padding: 8px 12px; border-radius: 10px; background: #fff3cd; color: #6b5200; font-size: 13px; display: none; }
  .banner.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="heading"></h1></header>
  <div id="banner" class="banner"></div>
  <div class="filters" id="filters"></div>
  <main id="list"></main>
  <button id="fab" aria-label="Добавить">+</button>
  <nav id="tabs"></nav>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle"></h2>
    <div id="form"></div>
    <div class="row">
      <button class="cancel" id="btnCancel">Отмена</button>
      <button class="save" id="btnSave">Сохранить</button>
    </div>
    <div class="row" id="delRow" style="margin-top:4px"><button class="del" id="btnDel">Удалить</button></div>
  </div>
</div>

<script>
// ===== НАСТРОЙКИ: вставьте сюда данные из Supabase (см. README.md) =====
const CONFIG = {
  SUPABASE_URL: "https://wanjfqmdanbfrvxusoul.supabase.co",
  SUPABASE_KEY: "sb_publishable_F_eGH9emspvGTiU3smvBBg_XWwxKEb0"   // publishable key (его можно держать в коде страницы)
};
// ======================================================================

// Описание списков. Чтобы добавить поле или новый список, правьте только этот блок.
const LISTS = {
  movies: {
    title: "Фильмы", icon: "🎬", doneLabel: "Посмотрено", todoLabel: "Хотим посмотреть",
    rating: true,
    fields: [
      { key: "note", label: "Заметка (кто посоветовал, где смотреть)", type: "text" }
    ],
    titleLabel: "Название фильма или сериала"
  },
  gifts: {
    title: "Подарки", icon: "🎁", doneLabel: "Куплено", todoLabel: "Идеи",
    fields: [
      { key: "forWhom", label: "Кому", type: "text" },
      { key: "price", label: "Примерная цена", type: "text" },
      { key: "link", label: "Ссылка", type: "url" }
    ],
    titleLabel: "Что подарить"
  },
  other: {
    title: "Прочее", icon: "📝", doneLabel: "Готово", todoLabel: "Активные",
    fields: [
      { key: "category", label: "Раздел (например: Поездки, Рестораны, Дом)", type: "text" },
      { key: "note", label: "Заметка", type: "text" }
    ],
    titleLabel: "Запись"
  }
};

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const me = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "";

// ---------- Хранилище ----------
const remote = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);

async function api(path, opts) {
  opts = opts || {};
  const headers = {
    apikey: CONFIG.SUPABASE_KEY,
    "Content-Type": "application/json",
    Prefer: "return=representation"
  };
  // Старые ключи (anon) - это JWT, их передают и в Authorization. Новые sb_publishable_ - только в apikey.
  if (CONFIG.SUPABASE_KEY.indexOf("eyJ") === 0) headers.Authorization = "Bearer " + CONFIG.SUPABASE_KEY;
  const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    body: opts.body,
    headers: headers
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

const LS_KEY = "our-lists-demo";
const store = remote ? {
  async load() { return api("items?select=*&order=created_at.desc"); },
  async add(it) { const rows = await api("items", { method: "POST", body: JSON.stringify(it) }); return rows[0]; },
  async update(id, patch) { await api("items?id=eq." + id, { method: "PATCH", body: JSON.stringify(patch) }); },
  async remove(id) { await api("items?id=eq." + id, { method: "DELETE" }); }
} : {
  _read() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; } },
  _write(a) { localStorage.setItem(LS_KEY, JSON.stringify(a)); },
  async load() { return this._read(); },
  async add(it) { const a = this._read(); const row = Object.assign({ id: Date.now() + Math.random(), created_at: new Date().toISOString() }, it); a.unshift(row); this._write(a); return row; },
  async update(id, patch) { const a = this._read(); const i = a.findIndex(x => x.id === id); if (i >= 0) Object.assign(a[i], patch); this._write(a); },
  async remove(id) { this._write(this._read().filter(x => x.id !== id)); }
};

// ---------- Состояние ----------
let items = [];
let currentTab = "movies";
let currentFilter = "all"; // all | todo | done
let editing = null;        // null = новая запись, иначе объект
let draftRating = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : (u ? "https://" + u : "");

// ---------- Отрисовка ----------
function renderTabs() {
  $("tabs").innerHTML = Object.keys(LISTS).map(k =>
    '<button data-tab="' + k + '" class="' + (k === currentTab ? "active" : "") + '"><span class="ic">' + LISTS[k].icon + '</span>' + LISTS[k].title + '</button>'
  ).join("");
}

function renderFilters() {
  const L = LISTS[currentTab];
  const opts = [["all", "Все"], ["todo", L.todoLabel], ["done", L.doneLabel]];
  $("filters").innerHTML = opts.map(o =>
    '<button class="chip ' + (o[0] === currentFilter ? "active" : "") + '" data-filter="' + o[0] + '">' + o[1] + '</button>'
  ).join("");
}

function renderList() {
  const L = LISTS[currentTab];
  $("heading").textContent = L.icon + " " + L.title;
  let rows = items.filter(x => x.list === currentTab);
  if (currentFilter === "todo") rows = rows.filter(x => !x.done);
  if (currentFilter === "done") rows = rows.filter(x => x.done);
  rows.sort((a, b) => (a.done - b.done) || (new Date(b.created_at) - new Date(a.created_at)));

  if (!rows.length) {
    $("list").innerHTML = '<div class="empty">Пока пусто.<br>Нажмите «+», чтобы добавить.</div>';
    return;
  }
  $("list").innerHTML = rows.map(x => {
    const d = x.data || {};
    const parts = [];
    L.fields.forEach(f => {
      if (!d[f.key]) return;
      if (f.type === "url") parts.push('<a href="' + esc(safeUrl(d[f.key])) + '" target="_blank" rel="noopener">ссылка</a>');
      else if (f.key === "forWhom") parts.push("для: " + esc(d[f.key]));
      else if (f.key === "price") parts.push(esc(d[f.key]));
      else parts.push(esc(d[f.key]));
    });
    const stars = (L.rating && x.done && d.rating) ? '<div class="stars">' + "★".repeat(d.rating) + "☆".repeat(5 - d.rating) + "</div>" : "";
    return '<div class="item ' + (x.done ? "done" : "") + '" data-id="' + esc(x.id) + '">' +
      '<button class="check" data-check="' + esc(x.id) + '">' + (x.done ? "✓" : "") + '</button>' +
      '<div class="body" data-edit="' + esc(x.id) + '">' +
        '<div class="title">' + esc(x.title) + '</div>' +
        (parts.length ? '<div class="sub">' + parts.join(" · ") + '</div>' : "") +
        stars +
        (x.author ? '<div class="who">добавил(а): ' + esc(x.author) + '</div>' : "") +
      '</div></div>';
  }).join("");
}

function render() { renderTabs(); renderFilters(); renderList(); }

// ---------- Форма ----------
function openForm(item) {
  editing = item || null;
  const L = LISTS[currentTab];
  const d = (item && item.data) || {};
  draftRating = d.rating || 0;
  $("sheetTitle").textContent = item ? "Изменить" : "Добавить: " + L.title.toLowerCase();
  let html = '<label>' + L.titleLabel + '</label><input type="text" id="f_title" value="' + esc(item ? item.title : "") + '">';
  L.fields.forEach(f => {
    html += '<label>' + f.label + '</label><input type="' + (f.type === "url" ? "url" : "text") + '" id="f_' + f.key + '" value="' + esc(d[f.key] || "") + '">';
  });
  if (L.rating) {
    html += '<label>Оценка</label><div class="starpick" id="starpick"></div>';
  }
  $("form").innerHTML = html;
  if (L.rating) paintStars();
  $("delRow").style.display = item ? "flex" : "none";
  $("overlay").classList.add("open");
  setTimeout(() => $("f_title").focus(), 50);
}

function paintStars() {
  const el = $("starpick");
  if (!el) return;
  el.innerHTML = [1, 2, 3, 4, 5].map(n => '<span data-star="' + n + '">' + (n <= draftRating ? "★" : "☆") + "</span>").join("");
}

function closeForm() { $("overlay").classList.remove("open"); editing = null; }

async function saveForm() {
  const L = LISTS[currentTab];
  const title = $("f_title").value.trim();
  if (!title) { $("f_title").focus(); return; }
  const data = {};
  L.fields.forEach(f => { const v = $("f_" + f.key).value.trim(); if (v) data[f.key] = v; });
  if (L.rating && draftRating) data.rating = draftRating;
  try {
    if (editing) {
      await store.update(editing.id, { title, data });
    } else {
      await store.add({ list: currentTab, title, data, done: false, author: me });
    }
    closeForm();
    await refresh();
  } catch (e) { showError(e); }
}

async function deleteItem() {
  if (!editing) return;
  if (!confirm("Удалить «" + editing.title + "»?")) return;
  try { await store.remove(editing.id); closeForm(); await refresh(); } catch (e) { showError(e); }
}

async function toggle(id) {
  const it = items.find(x => String(x.id) === String(id));
  if (!it) return;
  it.done = !it.done; // сразу показываем, потом сохраняем
  renderList();
  try { await store.update(it.id, { done: it.done }); } catch (e) { showError(e); await refresh(); }
}

// ---------- Загрузка и обновление ----------
function showError(e) {
  const b = $("banner");
  b.textContent = "Ошибка: " + (e && e.message ? e.message.slice(0, 160) : e);
  b.classList.add("show");
  setTimeout(() => b.classList.remove("show"), 6000);
}

async function refresh() {
  try { items = await store.load(); render(); } catch (e) { showError(e); }
}

// ---------- События ----------
document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest("[data-tab]");
  if (tab) { currentTab = tab.dataset.tab; currentFilter = "all"; render(); return; }
  const fl = t.closest("[data-filter]");
  if (fl) { currentFilter = fl.dataset.filter; renderFilters(); renderList(); return; }
  const ch = t.closest("[data-check]");
  if (ch) { toggle(ch.dataset.check); return; }
  const ed = t.closest("[data-edit]");
  if (ed && !t.closest("a")) { openForm(items.find(x => String(x.id) === ed.dataset.edit)); return; }
  const st = t.closest("[data-star]");
  if (st) { const n = +st.dataset.star; draftRating = (draftRating === n) ? 0 : n; paintStars(); return; }
});
$("fab").onclick = () => openForm(null);
$("btnCancel").onclick = closeForm;
$("btnSave").onclick = saveForm;
$("btnDel").onclick = deleteItem;
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeForm(); });

if (!remote) {
  $("banner").textContent = "Демо-режим: данные хранятся только на этом устройстве. Подключите базу (см. README), чтобы списки были общими.";
  $("banner").classList.add("show");
}

// Автообновление, чтобы видеть правки второго человека
setInterval(() => { if (!document.hidden && !$("overlay").classList.contains("open")) refresh(); }, 8000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

render();
refresh();
</script>
</body>
</html>
